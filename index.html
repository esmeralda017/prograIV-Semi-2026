<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Alumnos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card-registro { background-color: #212529; color: white; border-radius: 8px; padding: 20px; }
        .table-hover tbody tr { cursor: pointer; }
        .btn-nuevo { background-color: #ffc107; color: black; }
    </style>
</head>
<body>
    <div class="container-fluid mt-4" id="app">
        <div class="row">
            <div class="col-md-4">
                <div class="card-registro">
                    <h5 class="text-center mb-4">REGISTRO DE ALUMNOS</h5>
                    <form @submit.prevent="guardarAlumno" @reset.prevent="limpiarFormulario">
                        <div class="row mb-2">
                            <label class="col-sm-4 col-form-label-sm">CÓDIGO:</label>
                            <div class="col-sm-8">
                                <input v-model="alumno.codigo" type="text" class="form-control form-control-sm" required>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <label class="col-sm-4 col-form-label-sm">NOMBRE:</label>
                            <div class="col-sm-8">
                                <input v-model="alumno.nombre" type="text" class="form-control form-control-sm" required>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <label class="col-sm-4 col-form-label-sm">DIRECCIÓN:</label>
                            <div class="col-sm-8">
                                <textarea v-model="alumno.direccion" class="form-control form-control-sm" rows="2" required></textarea>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <label class="col-sm-4 col-form-label-sm">MUNICIPIO:</label>
                            <div class="col-sm-8">
                                <input v-model="alumno.municipio" type="text" class="form-control form-control-sm">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <label class="col-sm-4 col-form-label-sm">DEPTO:</label>
                            <div class="col-sm-8">
                                <input v-model="alumno.depto" type="text" class="form-control form-control-sm">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <label class="col-sm-4 col-form-label-sm">FECHA NAC:</label>
                            <div class="col-sm-8">
                                <input v-model="alumno.fechaNac" type="date" class="form-control form-control-sm">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <label class="col-sm-4 col-form-label-sm">SEXO:</label>
                            <div class="col-sm-8">
                                <select v-model="alumno.sexo" class="form-select form-select-sm">
                                    <option value="Masculino">Masculino</option>
                                    <option value="Femenino">Femenino</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <label class="col-sm-4 col-form-label-sm">EMAIL:</label>
                            <div class="col-sm-8">
                                <input v-model="alumno.email" type="email" class="form-control form-control-sm" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label class="col-sm-4 col-form-label-sm">TELÉFONO:</label>
                            <div class="col-sm-8">
                                <input v-model="alumno.telefono" type="text" class="form-control form-control-sm" required>
                            </div>
                        </div>
                        <div class="d-flex justify-content-center gap-2">
                            <button type="submit" class="btn btn-primary">GUARDAR</button>
                            <button type="reset" class="btn btn-nuevo">NUEVO</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card p-3 shadow-sm">
                    <div class="mb-3">
                        <input type="search" v-model="buscar" @keyup="obtenerAlumnos" class="form-control" placeholder="Buscar por nombre o código...">
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>CÓDIGO</th>
                                    <th>NOMBRE</th>
                                    <th>DIRECCIÓN</th>
                                    <th>UBICACIÓN</th>
                                    <th>SEXO</th>
                                    <th>EMAIL / TEL</th>
                                    <th>ACCIÓN</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="item in alumnos" :key="item.id" @click="modificarAlumno(item)">
                                    <td class="text-primary fw-bold">{{ item.codigo }}</td>
                                    <td>{{ item.nombre }}</td>
                                    <td style="max-width: 200px;"><small>{{ item.direccion }}</small></td>
                                    <td><small>{{ item.municipio }}, {{ item.depto }}</small></td>
                                    <td>{{ item.sexo }}</td>
                                    <td>
                                        <small>{{ item.email }}</small><br>
                                        <strong>{{ item.telefono }}</strong>
                                    </td>
                                    <td>
                                        <button class="btn btn-outline-danger btn-sm" @click.stop="eliminarAlumno(item.id)">Eliminar</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="main.js"></script>
</body>
</html>
