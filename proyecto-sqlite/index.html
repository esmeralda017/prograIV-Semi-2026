<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Académico - SQLite WASM + OPFS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css"/>
    <style>
        .cargando-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .spinner-container {
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Pantalla de carga -->
        <div v-if="cargando" class="cargando-overlay">
            <div class="spinner-container">
                <div class="spinner-border text-light mb-3" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <h4>Inicializando SQLite WASM...</h4>
                <p class="text-muted">Por favor espere</p>
            </div>
        </div>

        <nav class="navbar navbar-expand-lg bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">::.. SISTEMA ACADEMICO ..::</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link" href="#" @click.prevent="abrirVentana('alumnos')">Alumnos</a>
                        <a class="nav-link" href="#" @click.prevent="abrirVentana('materias')">Materias</a>
                        <a class="nav-link" href="#" @click.prevent="abrirVentana('docentes')">Docentes</a>
                    </div>
                </div>
            </div>
        </nav>

        <div id="appSistema" class="container-fluid">
            <!-- Alumnos -->
            <alumnos @buscar='buscar("busqueda_alumnos","obtenerAlumnos")' 
                     :forms="forms" ref="alumnos" v-show="forms.alumnos.mostrar"></alumnos>
            <busqueda_alumnos @modificar='modificar("alumnos","modificarAlumno", $event)' 
                              ref="busqueda_alumnos" v-show="forms.busqueda_alumnos.mostrar"></busqueda_alumnos>

            <!-- Materias -->
            <materias @buscar='buscar("busqueda_materias","obtenerMaterias")' 
                      :forms="forms" ref="materias" v-show="forms.materias.mostrar"></materias>
            <busqueda_materias @modificar='modificar("materias","modificarMateria", $event)' 
                               ref="busqueda_materias" v-show="forms.busqueda_materias.mostrar"></busqueda_materias>

            <!-- Docentes -->
            <docentes @buscar='buscar("busqueda_docentes","obtenerDocentes")' 
                      :forms="forms" ref="docentes" v-show="forms.docentes.mostrar"></docentes>
            <busqueda_docentes @modificar='modificar("docentes","modificarDocente", $event)' 
                               ref="busqueda_docentes" v-show="forms.busqueda_docentes.mostrar"></busqueda_docentes>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js"></script>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <!-- Componentes Vue -->
    <script src="componentes/alumnos.js"></script>
    <script src="componentes/busqueda_alumnos.js"></script>
    <script src="componentes/materias.js"></script>
    <script src="componentes/busqueda_materias.js"></script>
    <script src="componentes/docentes.js"></script>
    <script src="componentes/busqueda_docentes.js"></script>
    
    <!-- Main App -->
    <script src="main.js"></script>
</body>
</html>
